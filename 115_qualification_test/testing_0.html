<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>115年度網站無障礙檢測人員回訓測驗實測題</title>
  <style>
    :root {
      color-scheme: light;
      --brand: #175cd3;
      --brand-dark: #0b3f9c;
      --ink: #17202f;
      --muted: #526071;
      --line: #c7d0dc;
      --surface: #fff;
      --soft: #eef4ff;
      --success: #087443;
      --danger: #b42318;
      --radius: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans TC", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 0%, #e7efff 0, transparent 30rem),
        #f7f9fc;
      line-height: 1.6;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      touch-action: manipulation;
    }

    :focus-visible {
      outline: 3px solid #ec713c;
      outline-offset: 3px;
    }

    .skip-link {
      position: fixed;
      z-index: 20;
      top: 0.75rem;
      left: 0.75rem;
      padding: 0.65rem 1rem;
      color: #fff;
      background: #111827;
      transform: translateY(-180%);
    }

    .skip-link:focus {
      transform: none;
    }

    main {
      width: min(100% - 2rem, 960px);
      margin: 0 auto;
      padding: 2.5rem 0 4rem;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    .lead {
      max-width: 48rem;
      color: var(--muted);
    }

    .card {
      margin-top: 1.5rem;
      padding: clamp(1rem, 3vw, 2rem);
      border: 1px solid #dce3ed;
      border-radius: var(--radius);
      background: rgb(255 255 255 / 94%);
      box-shadow: 0 12px 32px rgb(22 34 51 / 8%);
    }

    .carousel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #101828;
    }

    .carousel-panel[hidden] {
      display: none;
    }

    .carousel-panel {
      position: relative;
      min-height: clamp(260px, 48vw, 420px);
      isolation: isolate;
      color: #fff;
    }

    .carousel-panel svg {
      position: absolute;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
    }

    .slide-copy {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 4rem clamp(1.25rem, 4vw, 2.5rem) 1.5rem;
      background: linear-gradient(transparent, rgb(0 0 0 / 82%));
    }

    .slide-copy h3 {
      margin: 0 0 0.25rem;
      font-size: clamp(1.35rem, 3vw, 2rem);
    }

    .slide-copy p {
      margin: 0;
      color: #f4f7fb;
    }

    .carousel-controls {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.8rem;
      align-items: center;
      margin-top: 1rem;
    }

    .nav-button {
      min-width: 3rem;
      min-height: 3rem;
      border: 2px solid var(--brand);
      border-radius: 999px;
      color: var(--brand);
      background: #fff;
      font-size: 1.25rem;
      font-weight: 800;
      cursor: pointer;
    }

    .nav-button:hover {
      color: #fff;
      background: var(--brand);
    }

    [role="tablist"] {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      justify-content: center;
    }

    [role="tab"] {
      min-width: 3rem;
      min-height: 2.75rem;
      padding: 0.45rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: #fff;
      cursor: pointer;
    }

    [role="tab"][aria-selected="true"] {
      border-color: var(--brand);
      color: #fff;
      background: var(--brand);
      box-shadow: inset 0 0 0 1px var(--brand);
    }

    form {
      max-width: 42rem;
    }

    .field {
      margin-top: 1.25rem;
    }

    label,
    legend {
      font-weight: 700;
    }

    input[type="text"] {
      width: 100%;
      min-height: 3rem;
      margin-top: 0.4rem;
      padding: 0.65rem 0.8rem;
      border: 1px solid #98a2b3;
      border-radius: 8px;
      color: var(--ink);
      background: #fff;
    }

    fieldset {
      margin: 1.5rem 0 0;
      padding: 0;
      border: 0;
    }

    .captcha-display {
      display: inline-flex;
      align-items: center;
      min-height: 3.25rem;
      margin: 0.5rem 0 0.75rem;
      padding: 0.5rem 1rem;
      border: 2px dashed #667085;
      border-radius: 8px;
      color: #101828;
      background:
        repeating-linear-gradient(
          -35deg,
          #f2f4f7 0,
          #f2f4f7 8px,
          #e4e7ec 8px,
          #e4e7ec 10px
        );
      font: 800 1.55rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.4em;
    }

    .regenerate-row {
      margin: 0 0 1rem;
    }

    .regenerate-row a {
      color: var(--brand-dark);
      font-weight: 700;
    }

    .code-inputs {
      display: flex;
      gap: 0.75rem;
    }

    .code-inputs input {
      width: 3.5rem;
      min-height: 3.5rem;
      margin: 0;
      padding: 0.5rem;
      text-align: center;
      font-size: 1.4rem;
      font-weight: 800;
    }

    .hint {
      margin: 0.65rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .error {
      min-height: 1.5em;
      margin: 0.5rem 0 0;
      color: var(--danger);
      font-weight: 700;
    }

    .submit-button {
      min-height: 3rem;
      margin-top: 1.5rem;
      padding: 0.65rem 1.25rem;
      border: 2px solid var(--brand);
      border-radius: 8px;
      color: #fff;
      background: var(--brand);
      font-weight: 800;
      cursor: pointer;
    }

    .submit-button:hover {
      background: var(--brand-dark);
    }

    .submit-link {
      display: inline-block;
      text-decoration: none;
    }

    .form-feedback {
      min-height: 1.8em;
      margin: 1rem 0 0;
      color: var(--success);
      font-weight: 800;
    }

    dialog {
      width: min(100% - 2rem, 30rem);
      padding: 0;
      border: 0;
      border-radius: 16px;
      color: var(--ink);
      box-shadow: 0 24px 72px rgb(0 0 0 / 35%);
    }

    dialog::backdrop {
      background: rgb(16 24 40 / 68%);
      backdrop-filter: blur(2px);
    }

    .dialog-body {
      padding: 1.5rem;
    }

    .dialog-body h2 {
      padding-right: 2.5rem;
    }

    .dialog-code {
      display: block;
      margin: 1rem 0;
      padding: 1rem;
      border-radius: 8px;
      color: #fff;
      background: #101828;
      text-align: center;
      font: 800 2rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.35em;
    }

    .dialog-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: flex-end;
    }

    .dialog-actions button {
      min-height: 2.75rem;
      padding: 0.55rem 1rem;
      border: 1px solid var(--brand);
      border-radius: 8px;
      color: var(--brand-dark);
      background: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .dialog-actions .primary {
      color: #fff;
      background: var(--brand);
    }

    @media (max-width: 620px) {
      .carousel-controls {
        grid-template-columns: auto auto;
      }

      [role="tablist"] {
        grid-column: 1 / -1;
        grid-row: 2;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>

  <main id="main-content">
    <h1>115年度網站無障礙檢測人員回訓測驗</h1>
    <p class="lead">
      本次回訓檢測實測等級為：AA。 <br>
      本頁作為回訓檢測用頁，故本頁不使用「跳到主要內容區」頁內連結、「網站導覽」，意思就是：不用抓缺少「跳到主要內容區」及「網站導覽」這2項，抓這2項在這次測驗抓了也沒有分。
    </p>

    <section class="card" aria-labelledby="carousel-title">

      <div class="carousel">
        <div

            <path d="M0 380 180 300 330 370 510 280 700 370 850 310 960 355V480H0Z" fill="#18344d"/>
          </svg>
          <div aria-hidden="true" class="slide-copy">
            <h3>晨光山城</h3>
            <p>清晨的陽光越過山稜，照亮安靜的城市。</p>

        <div

            <defs>

        <div

        >

            <defs>
              <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">

                <stop offset="1" stop-color="#fdb6a7"/>

            </defs>

          <button

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">資料驗證表單</h2>

      <form id="verification-form" novalidate>
        <div class="field">
          <label for="user-name">姓名(必填)</label>
          <input id="user-name" name="userName" type="text" autocomplete="name" required>
          <p class="error" id="name-error" role="alert"></p>
        </div>

        <fieldset>
          <legend>驗證碼(必填)</legend>

          <div aria-label="目前驗證碼"><div class="captcha-display" id="captcha-on-page" aria-hidden="true"></div></div>

          <p class="regenerate-row">
            <a href="#" id="regenerate-code"><button>重新產生驗證碼</button></a>
          </p>

          <div class="code-inputs">
            <input
              id="code-1"
              name="code1"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              maxlength="1"
              pattern="[0-9]"
              aria-label="驗證碼第一格"
              required
            >
            <input
              id="code-2"
              name="code2"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              maxlength="1"
              pattern="[0-9]"
              aria-label="驗證碼第二格"
              required
            >
            <input
              id="code-3"
              name="code3"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              maxlength="1"
              pattern="[0-9]"
              aria-label="驗證碼第三格"
              required
            >
            <input
              id="code-4"
              name="code4"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              maxlength="1"

              required
            >

  <dialog id="captcha-dialog" aria-labelledby="dialog-title">
    <div class="dialog-body">
      <h2 id="dialog-title">新的驗證碼</h2>
      <output class="dialog-code" id="dialog-code"></output>
      <div class="dialog-actions">
        <button type="button" id="copy-code">複製</button>
        <button type="button" class="primary" id="close-dialog">關閉</button>
      </div>
    </div>
  </dialog>

  <script>
    (() => {
      "use strict";

 
      const tabs = [...document.querySelectorAll('[role="tab"]')];
      const panels = tabs.map((tab) =>
        document.getElementById(tab.getAttribute("aria-controls"))
      );
      const previousButton = document.getElementById("previous-slide");
      const nextButton = document.getElementById("next-slide");
      let activeIndex = 0;

      function showSlide(index, moveFocus = false) {
        activeIndex = (index + tabs.length) % tabs.length;

        tabs.forEach((tab, tabIndex) => {
          const selected = tabIndex === activeIndex;
          tab.setAttribute("aria-selected", String(selected));
          tab.tabIndex = selected ? 0 : -1;
          panels[tabIndex].hidden = !selected;
        });

        if (moveFocus) {
          tabs[activeIndex].focus();
        }
      }

      tabs.forEach((tab, index) => {
        tab.addEventListener("click", () => showSlide(index));

        tab.addEventListener("keydown", (event) => {
          let targetIndex = null;

          if (event.key === "ArrowRight" || event.key === "ArrowDown") {
            targetIndex = index + 1;
          } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
            targetIndex = index - 1;
          } else if (event.key === "Home") {
            targetIndex = 0;
          } else if (event.key === "End") {
            targetIndex = tabs.length - 1;
          }

          if (targetIndex !== null) {
            event.preventDefault();
            showSlide(targetIndex, true);
          }
        });
      });

      previousButton.addEventListener("click", () => showSlide(activeIndex - 1));
      nextButton.addEventListener("click", () => showSlide(activeIndex + 1));

      // 驗證碼：本範例為純前端操作展示，不能作為真正的防機器人機制。
      const form = document.getElementById("verification-form");
      const userName = document.getElementById("user-name");
      const nameError = document.getElementById("name-error");
      const codeInputs = [...document.querySelectorAll(".code-inputs input")];
      const captchaOnPage = document.getElementById("captcha-on-page");
      const regenerateLink = document.getElementById("regenerate-code");
      const dialog = document.getElementById("captcha-dialog");
      const dialogCode = document.getElementById("dialog-code");
      const copyButton = document.getElementById("copy-code");
      const closeDialogButton = document.getElementById("close-dialog");
      const codeError = document.getElementById("code-error");
      const formFeedback = document.getElementById("form-feedback");
      let currentCode = "";

      function createCode() {
        return Array.from({ length: 4 }, () =>
          Math.floor(Math.random() * 10)
        ).join("");
      }

      function clearCodeInputs() {
        codeInputs.forEach((input) => {
          input.value = "";
          input.removeAttribute("aria-invalid");
        });
        codeError.textContent = "";
      }

      function setNewCode() {
        currentCode = createCode();
        captchaOnPage.textContent = currentCode;
        dialogCode.textContent = currentCode;
        clearCodeInputs();
        formFeedback.textContent = "";
      }

      regenerateLink.addEventListener("click", (event) => {
        event.preventDefault();
        setNewCode();
        dialog.showModal();
      });

      closeDialogButton.addEventListener("click", () => dialog.close());

      copyButton.addEventListener("click", async () => {
        let copied = false;

        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(currentCode);
            copied = true;
          }
        } catch (error) {
          copied = false;
        }

        // 直接開啟本機 HTML 時，Clipboard API 可能不可用，改採備援方式。
        if (!copied) {
          const temporaryInput = document.createElement("textarea");
          temporaryInput.value = currentCode;
          temporaryInput.setAttribute("readonly", "");
          temporaryInput.style.position = "fixed";
          temporaryInput.style.opacity = "0";
          document.body.appendChild(temporaryInput);
          temporaryInput.select();
          copied = document.execCommand("copy");
          temporaryInput.remove();
        }

        copyButton.textContent = copied ? "已複製" : "無法複製";
      });

      dialog.addEventListener("close", () => {
        copyButton.textContent = "複製";
        regenerateLink.focus();
      });

      codeInputs.forEach((input, index) => {
        
        input.addEventListener("paste", (event) => {
          event.preventDefault();
        });

        input.addEventListener("drop", (event) => {
          event.preventDefault();
        });

        input.addEventListener("input", () => {
          input.value = input.value.replace(/\D/g, "").slice(0, 1);
          input.removeAttribute("aria-invalid");
          codeError.textContent = "";

          if (input.value && index < codeInputs.length - 1) {
            codeInputs[index + 1].focus();
          }
        });

        input.addEventListener("keydown", (event) => {
          if (
            event.key === "Backspace" &&
            input.value === "" &&
            index > 0
          ) {
            codeInputs[index - 1].focus();
          }
        });
      });

      userName.addEventListener("input", () => {
        userName.removeAttribute("aria-invalid");
        nameError.textContent = "";
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        formFeedback.textContent = "";

        const isNameEmpty = !userName.value.trim();
        const enteredCode = codeInputs.map((input) => input.value).join("");
        const isCodeInvalid =
          enteredCode.length !== 4 || enteredCode !== currentCode;

        if (isNameEmpty) {
          userName.setAttribute("aria-invalid", "true");
          nameError.textContent = "姓名欄位為必填，不可空白。";
        } else {
          userName.removeAttribute("aria-invalid");
          nameError.textContent = "";
        }

        if (isCodeInvalid) {
          codeInputs.forEach((input) =>
            input.setAttribute("aria-invalid", "true")
          );
          codeError.textContent = "驗證碼錯誤，請重新輸入。";
        } else {
          codeError.textContent = "";
          codeInputs.forEach((input) => input.removeAttribute("aria-invalid"));
        }

        if (isNameEmpty || isCodeInvalid) {
          (isNameEmpty ? userName : codeInputs[0]).focus();
          return;
        }

        
        formFeedback.textContent = "表單已成功送出。";
        form.reset();
        setNewCode();
        formFeedback.textContent = "表單已成功送出。";
      });

      setNewCode();
    })();
  </script>
</body>
</html>
